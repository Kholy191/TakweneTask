# Local dependencies: PostgreSQL + Seq. Run with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: takwene-postgres
    environment:
      POSTGRES_DB: takwene
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - takwene-pgdata:/var/lib/postgresql/data

  seq:
    image: datalust/seq:latest
    container_name: takwene-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80" # UI and log ingestion: http://localhost:5341

volumes:
  takwene-pgdata:
